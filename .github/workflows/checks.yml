name: Development releases and follow-up checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  prototype:
    name: Android APK and content checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BRACKENWARD_GODOT: /home/runner/.local/share/brackenward/toolchain/4.7.2/Godot_v4.7.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            platform/android_save/**/*.gradle*
            platform/android_save/gradle.properties
            toolchain.lock.json
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/brackenward/toolchain/*.zip
            ~/.local/share/brackenward/toolchain/*.tpz
          key: export-toolchain-linux-x64-${{ hashFiles('toolchain.lock.json') }}
      - name: Install verified engine/templates
        run: python3 tools/bootstrap.py
      - name: Install Android command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android toolchain packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0' 'ndk;29.0.14206865' 'cmake;3.10.2.4988404'
      - name: Validate media and prototype contract
        run: |
          python3 tools/test_gdscript_strings.py
          python3 tools/test_ui_messages.py
          python3 tools/test_run_soak.py
          python3 tools/test_trade_free_audit.py
          python3 tools/test_post_charter_sweep.py
          python3 tools/test_merchant_sweep.py
          python3 tools/test_defense_sweep.py
          python3 tools/test_push_checkpoint.py
          python3 tools/test_stamp_build.py
          python3 tools/test_validate_raw_map.py
          python3 tools/test_map_sweep.py
          python3 tools/test_check_suite.py
          python3 tools/test_fixture_checkout.py
          python3 tools/validate_content.py
      - name: Build/test Kotlin plugin and Android release APK
        env:
          DEVELOPMENT_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEVELOPMENT_KEYSTORE_BASE64" ]; then
            umask 077
            printf '%s' "$DEVELOPMENT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/brackenward-development.keystore"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            echo 'Missing stable development keystore secret.' >&2
            exit 1
          else
            # Fork PRs get a disposable identity; only main publishes updates.
            keytool -genkeypair -keystore "$RUNNER_TEMP/brackenward-development.keystore" -storepass android -keypass android -alias androiddebugkey -dname 'CN=Brackenward PR' -keyalg RSA -keysize 2048 -validity 30
          fi
          # Keep the existing certificate so release-mode APKs update debug APKs.
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/brackenward-development.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android
          python3 tools/stamp_build.py
          tools/build_android.sh --release
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose build/brackenward-release.apk
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging build/brackenward-release.apk > build/apk-badging.txt
          if grep -q '^application-debuggable' build/apk-badging.txt; then
            echo 'Release APK unexpectedly enables debugging.' >&2
            exit 1
          fi
          mkdir -p build/download
          APK_FILENAME=$(python3 -c 'import json; print(json.load(open("data/build.json"))["apk_filename"])')
          cp build/brackenward-release.apk "build/download/$APK_FILENAME"
          cp data/build.json build/download/build.json
          (cd build/download && sha256sum "$APK_FILENAME" > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: development-apk
          path: build/download/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-evidence
          path: |
            platform/android_save/plugin/build/test-results/test*UnitTest/*.xml
            build/apk-badging.txt
            data/build.json
          if-no-files-found: warn

  simulation:
    name: Simulation (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BRACKENWARD_GODOT: /home/runner/.local/share/brackenward/toolchain/4.7.2/Godot_v4.7.2-stable_linux.x86_64
    strategy:
      fail-fast: false
      matrix:
        # Balanced against CI suite timings; each runner has its own project,
        # user data and reports. Never run suites concurrently in one checkout.
        shard: [persistence, scheduler, generation, colony, gameplay]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/brackenward/toolchain/*.zip
          key: native-editor-linux-x64-${{ hashFiles('toolchain.lock.json') }}
      - name: Install checksum-verified editor
        run: python3 tools/bootstrap.py --editor-only
      - name: Import project
        run: python3 tools/checked_godot.py -- --headless --editor --import
      - name: Persistence, baseline and item checks
        if: matrix.shard == 'persistence'
        run: |
          python3 tools/check_suite.py persistence --timeout 180
          python3 tools/check_suite.py unit
          python3 tools/check_suite.py integration
          python3 tools/check_suite.py equipment
          python3 tools/check_suite.py population
          python3 tools/check_suite.py trade
      - name: Scheduler and construction checks
        if: matrix.shard == 'scheduler'
        run: |
          python3 tools/check_suite.py scheduler --timeout 240
          python3 tools/check_suite.py construction
          python3 tools/check_suite.py maintenance
      - name: Generation and production checks
        if: matrix.shard == 'generation'
        run: |
          python3 tools/check_suite.py generation --timeout 360
          python3 tools/check_suite.py production
      - name: Colony, survival and region checks
        if: matrix.shard == 'colony'
        run: |
          python3 tools/check_suite.py colony
          python3 tools/check_suite.py survival
          python3 tools/check_suite.py region
      - name: People, events, wildlife and tutorial checks
        if: matrix.shard == 'gameplay'
        run: |
          python3 tools/check_suite.py seasons
          python3 tools/check_suite.py people
          python3 tools/check_suite.py care
          python3 tools/check_suite.py nature
          python3 tools/check_suite.py wildlife
          python3 tools/check_suite.py domestic
          python3 tools/check_suite.py fire
          python3 tools/check_suite.py defense
          python3 tools/check_suite.py director
          python3 tools/check_suite.py opportunity
          python3 tools/check_suite.py charter
          python3 tools/check_suite.py chronicle
          python3 tools/check_suite.py tutorial
          python3 tools/check_suite.py tutorial_flow --site meadow_reach
          python3 tools/check_suite.py tutorial_flow --site pine_shelf
          python3 tools/check_suite.py tutorial_flow --site reed_bend
      - name: Verify paired prepared defense and physical ransom delivery
        if: matrix.shard == 'gameplay'
        run: |
          python3 tools/checked_godot.py --timeout 240 -- --headless --script tools/defense_scenario.gd -- --seed 104729 --site meadow_reach --report reports/prepared-defense-ci.json > reports/prepared-defense-ci.log
          PYTHONPATH=tools python3 - <<'PY'
          import json
          from pathlib import Path
          from defense_sweep import verify
          result = verify(Path('reports/prepared-defense-ci.json'), 0, 'meadow_reach', 104729)
          Path('reports/prepared-defense-ci-audit.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result))
          raise SystemExit(0 if result['passed'] else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-evidence-${{ matrix.shard }}
          path: |
            reports/*.xml
            reports/*.png
            reports/prepared-defense-ci*
          if-no-files-found: warn

  ui:
    name: Graphical UI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BRACKENWARD_GODOT: /home/runner/.local/share/brackenward/toolchain/4.7.2/Godot_v4.7.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/brackenward/toolchain/*.zip
          key: native-editor-linux-x64-${{ hashFiles('toolchain.lock.json') }}
      - name: Install checksum-verified editor
        run: python3 tools/bootstrap.py --editor-only
      - name: Install Linux UI test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Import project
        run: python3 tools/checked_godot.py -- --headless --editor --import
      - name: Real Control/input/layout suite
        run: xvfb-run -a python3 tools/check_suite.py ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-evidence
          path: |
            reports/*.xml
            reports/*.png
            reports/visual-polish/*.png
          if-no-files-found: warn

  desktop:
    name: Desktop release packages and Linux launch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BRACKENWARD_GODOT: /home/runner/.local/share/brackenward/toolchain/4.7.2/Godot_v4.7.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/brackenward/toolchain/*.zip
            ~/.local/share/brackenward/toolchain/*.tpz
          key: export-toolchain-linux-x64-${{ hashFiles('toolchain.lock.json') }}
      - name: Install verified engine/templates
        run: python3 tools/bootstrap.py
      - name: Install Linux graphical smoke dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Stamp exact-source desktop versions and import project
        run: |
          python3 tools/stamp_build.py
          python3 tools/checked_godot.py -- --headless --editor --import
      - name: Export desktop releases
        run: |
          mkdir -p build/desktop/{windows,macos,linux}
          python3 tools/checked_godot.py -- --headless --export-release Windows build/desktop/windows/brackenward.exe
          python3 tools/checked_godot.py -- --headless --export-release macOS build/desktop/macos/brackenward.zip
          python3 tools/checked_godot.py -- --headless --export-release Linux build/desktop/linux/brackenward
      - name: Package numbered desktop downloads
        run: |
          BUILD_NUMBER=$(jq -r '.version_code' data/build.json)
          PREFIX=$(printf 'brackenward-build-%06d' "$BUILD_NUMBER")
          mkdir -p build/desktop-download
          # Ship each executable with its PCK and any generated support files.
          test -s build/desktop/windows/brackenward.exe
          test -s build/desktop/windows/brackenward.pck
          test -x build/desktop/linux/brackenward
          test -s build/desktop/linux/brackenward.pck
          (cd build/desktop/windows && zip -r "../../desktop-download/$PREFIX-windows-x86_64.zip" .)
          cp build/desktop/macos/brackenward.zip "build/desktop-download/$PREFIX-macos-universal.zip"
          tar -C build/desktop/linux -czf "build/desktop-download/$PREFIX-linux-x86_64.tar.gz" .
          cp data/build.json build/desktop-download/build.json
          (cd build/desktop-download && sha256sum ./*.zip ./*.tar.gz > SHA256SUMS.txt)
      - name: Launch extracted Linux download from an empty working directory
        run: |
          mkdir -p "$RUNNER_TEMP/brackenward-linux-download"
          tar -xzf build/desktop-download/*-linux-x86_64.tar.gz -C "$RUNNER_TEMP/brackenward-linux-download"
          mkdir -p "$RUNNER_TEMP/brackenward-exported-smoke"
          xvfb-run -a python3 tools/checked_godot.py --executable "$RUNNER_TEMP/brackenward-linux-download/brackenward" --working-directory "$RUNNER_TEMP/brackenward-exported-smoke" --require-smoke-exit -- --audio-driver Dummy --quit-after 1200 -- --native-smoke-frames 60
      - uses: actions/upload-artifact@v4
        with:
          name: development-desktop
          path: build/desktop-download/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-exports
          path: |
            build/desktop/
            data/build.json
          if-no-files-found: warn

  # Publish after the core build checks, before the extended validation jobs.
  publish:
    name: Publish Android and desktop development releases
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [prototype, simulation, ui, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: development-apk
          path: download
      - uses: actions/download-artifact@v4
        with:
          name: development-desktop
          path: download/desktop
      - name: Verify matching source and combine download checksums
        run: |
          cmp download/build.json download/desktop/build.json
          (cd download/desktop && sha256sum --check SHA256SUMS.txt)
          cp download/desktop/*.zip download/desktop/*.tar.gz download/
          cat download/desktop/SHA256SUMS.txt >> download/SHA256SUMS.txt
          (cd download && sha256sum --check SHA256SUMS.txt)
      - name: Publish checked Android and desktop builds for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=$(jq -r '.release_tag' download/build.json)
          BUILD_NUMBER=$(jq -r '.version_code' download/build.json)
          DESKTOP_PREFIX=$(printf 'brackenward-build-%06d' "$BUILD_NUMBER")
          APK_FILENAME=$(jq -r '.apk_filename' download/build.json)
          BUILD_COMMIT=$(jq -r '.commit' download/build.json)
          BUILD_KIND=$(jq -r '.kind' download/build.json)
          if [ "$BUILD_COMMIT" != "$GITHUB_SHA" ] || [ "$TAG" != "v0.0.$BUILD_NUMBER-dev" ] || [ "$BUILD_KIND" != development_release ]; then
            echo "APK build metadata differs from the checked source or release version." >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Development build $BUILD_NUMBER from commit $GITHUB_SHA.

          Desktop downloads (extract the complete archive before launching):
          - Windows 10/11 x86-64: $DESKTOP_PREFIX-windows-x86_64.zip, run brackenward.exe.
          - macOS 13+ Intel and Apple Silicon: $DESKTOP_PREFIX-macos-universal.zip, move Brackenward.app to Applications. This development app has an ad-hoc signature and is not notarized; see [Godot's macOS launch instructions](https://docs.godotengine.org/en/stable/tutorials/export/running_on_macos.html).
          - Linux x86-64: $DESKTOP_PREFIX-linux-x86_64.tar.gz, run ./brackenward from the extracted folder.

          Higher build numbers are newer. Download $APK_FILENAME below and sideload it on an Android 10+ arm64 phone. These development APKs share a signing identity and can update one another while preserving app data. Saves from development milestones remain explicitly versioned; do not uninstall the app to update it.

          Automated simulation, UI, Kotlin, APK and desktop-export checks passed in [this run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Extended cross-platform replay and map-sweep checks run after publication; inspect their jobs in that run for pending, successful or failed results. Their failures remain visible without delaying this development download. Physical-phone testing remains pending. This APK uses Godot/Android release mode with debugging disabled, signed with the existing development certificate so it can update earlier debug APKs. It remains an unfinished development prerelease; production signing and store distribution are later gates.

          build.json identifies the shared source and build; SHA256SUMS.txt verifies the APK and all three desktop archives. Desktop exports and the extracted Linux graphical launch passed; exported Windows/macOS gameplay testing remains separate from the native-editor replay checks.
          EOF
          if ! gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            MAIN_SHA=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
            if [ "$MAIN_SHA" != "$GITHUB_SHA" ]; then
              echo "This older checked commit needs its exact tag reserved with tools/push_checkpoint.py; no release was published." >&2
              exit 1
            fi
            gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" >/dev/null
          fi
          TAG_SHA=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq 'select(.object.type == "commit") | .object.sha')
          if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "Development tag differs from the checked source; retained unchanged." >&2
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "Build $BUILD_NUMBER (development)" --draft --prerelease --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$TAG" "download/$APK_FILENAME" download/*.zip download/*.tar.gz download/SHA256SUMS.txt download/build.json --clobber
          gh release edit "$TAG" --draft=false
          {
            echo '### Android and desktop development builds published'
            echo
            echo "[Download build $BUILD_NUMBER](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG)"
            echo
            echo 'Extended replay and map-sweep jobs run next and report their own results. The download is ready while those checks run.'
          } >> "$GITHUB_STEP_SUMMARY"

  generation-sweep:
    needs: [publish]
    # Also run when publication is skipped on PRs or an earlier job fails.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BRACKENWARD_GODOT: /home/runner/.local/share/brackenward/toolchain/4.7.2/Godot_v4.7.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/brackenward/toolchain/*.zip
          key: native-editor-linux-x64-${{ hashFiles('toolchain.lock.json') }}
      - name: Install checksum-verified editor
        run: python3 tools/bootstrap.py --editor-only
      - name: Import map export scripts
        run: python3 tools/checked_godot.py -- --headless --editor --import
      - name: Independently validate 256 hashed seeds per site
        run: python3 tools/map_sweep.py --source "$GITHUB_WORKSPACE" --report-dir reports/generation-ci-sweep --start 6 --count 256 --workers 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-generation-subset
          path: reports/generation-ci-sweep
          if-no-files-found: warn

  native-replay:
    name: Native replay (${{ matrix.name }})
    needs: [publish]
    # Preserve real failures; this condition only controls scheduling.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.job_timeout || 35 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            name: linux-x64
          - runner: macos-15
            name: macos-arm64
          - runner: macos-15-intel
            name: macos-x64
            job_timeout: 50
            replay_timeout: 1500
            generation_timeout: 600
            persistence_timeout: 600
          - runner: windows-2022
            name: windows-x64
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/brackenward/toolchain/*.zip
          key: native-editor-${{ matrix.name }}-${{ hashFiles('toolchain.lock.json') }}
      - name: Verify installer and graphical evidence checks
        run: |
          python tools/test_bootstrap.py
          python tools/test_native_smoke.py
          python tools/test_checked_godot.py
          python tools/test_stamp_build.py
          python tools/test_check_suite.py
      - name: Install checksum-verified native editor only
        run: python tools/bootstrap.py --editor-only
      - name: Compare canonical replay and imported-save continuation
        run: python tools/replay_campaign.py --report reports/replay-${{ matrix.name }}.json --replay-timeout ${{ matrix.replay_timeout || 780 }}
      - name: Check inspected generator-2 golden maps and generator-1 compatibility
        run: python tools/check_suite.py generation --timeout ${{ matrix.generation_timeout || 360 }} > reports/replay-${{ matrix.name }}-generation.log
      - name: Verify persistence and bounded snapshot bytes on this native editor
        run: python tools/check_suite.py persistence --timeout ${{ matrix.persistence_timeout || 360 }} > reports/replay-${{ matrix.name }}-persistence.log
      - name: Install Linux graphical smoke dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Launch native source project with a graphical renderer (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/native_smoke.py --skip-import --report reports/replay-${{ matrix.name }}-native-smoke.json
      - name: Launch native source project with a graphical renderer (macOS and Windows)
        if: runner.os != 'Linux'
        run: python tools/native_smoke.py --skip-import --report reports/replay-${{ matrix.name }}-native-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-replay-${{ matrix.name }}
          path: |
            reports/replay-${{ matrix.name }}*
            reports/generation.xml
            reports/persistence.xml
          if-no-files-found: warn
