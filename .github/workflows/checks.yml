name: Checks, exports and development APK releases

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BRACKENWARD_GODOT: /home/runner/.local/share/brackenward/toolchain/4.7.2/Godot_v4.7.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install verified engine/templates
        run: python3 tools/bootstrap.py
      - name: Install Android command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android toolchain packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0' 'ndk;29.0.14206865' 'cmake;3.10.2.4988404'
      - name: Validate media and prototype contract
        run: python3 tools/validate_content.py
      - name: Install Linux UI test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Import project
        run: tools/godot.sh --headless --editor --import
      - name: Unit and deterministic integration checks
        run: |
          python3 tools/check_suite.py unit
          python3 tools/check_suite.py integration
          python3 tools/check_suite.py colony
          python3 tools/check_suite.py survival
          python3 tools/check_suite.py persistence
          python3 tools/check_suite.py seasons
          python3 tools/check_suite.py people
          python3 tools/check_suite.py production
          python3 tools/check_suite.py care
          python3 tools/check_suite.py generation
          python3 tools/check_suite.py nature
          python3 tools/check_suite.py wildlife
          python3 tools/check_suite.py domestic
          python3 tools/check_suite.py construction
          python3 tools/check_suite.py equipment
          python3 tools/check_suite.py maintenance
          python3 tools/check_suite.py population
          python3 tools/check_suite.py trade
          python3 tools/check_suite.py region
          python3 tools/check_suite.py fire
          python3 tools/check_suite.py defense
          python3 tools/check_suite.py director
          python3 tools/check_suite.py opportunity
          python3 tools/check_suite.py charter
          python3 tools/check_suite.py chronicle
          python3 tools/check_suite.py scheduler
          python3 tools/check_suite.py tutorial
      - name: Real Control/input/layout suite
        run: xvfb-run -a python3 tools/check_suite.py ui
      - name: Build/test Kotlin plugin and Android debug APK
        env:
          DEVELOPMENT_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEVELOPMENT_KEYSTORE_BASE64" ]; then
            umask 077
            printf '%s' "$DEVELOPMENT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/brackenward-debug.keystore"
            export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$RUNNER_TEMP/brackenward-debug.keystore"
            export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
            export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            echo 'Missing stable development keystore secret.' >&2
            exit 1
          fi
          python3 tools/stamp_build.py
          tools/build_android.sh
          mkdir -p build/download
          cp build/brackenward-debug.apk build/download/
          cp data/build.json build/download/build.json
          (cd build/download && sha256sum brackenward-debug.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: development-apk
          path: build/download/
          if-no-files-found: error
      - name: Export desktop prototypes
        run: |
          tools/godot.sh --headless --export-debug Windows build/brackenward.exe
          tools/godot.sh --headless --export-debug macOS build/brackenward-macos.zip
          tools/godot.sh --headless --export-debug Linux build/brackenward-linux
          xvfb-run -a build/brackenward-linux --audio-driver Dummy --quit-after 60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prototype-evidence
          path: |
            reports/*.xml
            reports/*.png
            platform/android_save/plugin/build/test-results/testDebugUnitTest/*.xml
            build/
          if-no-files-found: warn

  native-replay:
    name: Native replay (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            name: linux-x64
          - runner: macos-15
            name: macos-arm64
          - runner: macos-15-intel
            name: macos-x64
          - runner: windows-2022
            name: windows-x64
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/brackenward/toolchain/*.zip
          key: native-editor-${{ matrix.name }}-${{ hashFiles('toolchain.lock.json') }}
      - name: Verify installer idempotence and failure preservation
        run: python tools/test_bootstrap.py
      - name: Install checksum-verified native editor only
        run: python tools/bootstrap.py --editor-only
      - name: Compare canonical replay and imported-save continuation
        run: python tools/replay_campaign.py --report reports/replay-${{ matrix.name }}.json
      - name: Install Linux graphical smoke dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Launch native source project with a graphical renderer (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/native_smoke.py --skip-import --report reports/replay-${{ matrix.name }}-native-smoke.json
      - name: Launch native source project with a graphical renderer (macOS and Windows)
        if: runner.os != 'Linux'
        run: python tools/native_smoke.py --skip-import --report reports/replay-${{ matrix.name }}-native-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-replay-${{ matrix.name }}
          path: reports/replay-${{ matrix.name }}*
          if-no-files-found: warn

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [prototype, native-replay]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: development-apk
          path: download
      - name: Publish checked APK for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="dev-${GITHUB_SHA:0:12}"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Development APK from commit $GITHUB_SHA.

          Download brackenward-debug.apk below and sideload it on an Android 10+ arm64 phone. These development APKs share a signing identity and can update one another while preserving app data. Saves from development milestones remain explicitly versioned; do not uninstall the app to update it.

          Automated simulation, UI, Kotlin, APK and desktop-export checks passed in [this run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Physical-phone testing remains pending. This is a debug build, not the finished game or a production-signed release.

          build.json identifies the source and build; SHA256SUMS.txt verifies the APK.
          EOF
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Development ${GITHUB_SHA:0:7}" --draft --prerelease --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$TAG" download/brackenward-debug.apk download/SHA256SUMS.txt download/build.json --clobber
          gh release edit "$TAG" --draft=false
